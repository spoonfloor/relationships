<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="relationships" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#121212" />
  <title>relationships</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link
    rel="preload"
    href="fonts/atkinson-hyperlegible-regular.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />
  <link rel="stylesheet" href="styles/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app-shell" class="app-shell">
    <main id="scroll-content" class="app">
      <header id="app-bar" class="app-bar">
        <div class="puzzle-title-wrap">
          <h1 id="puzzle-title" class="puzzle-title"></h1>
        </div>
        <div class="app-bar__menu">
          <button
            id="app-bar-more-btn"
            class="app-bar__more-btn"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="app-bar-menu"
            aria-label="More"
          >
            <span class="material-icons" aria-hidden="true">more_vert</span>
          </button>
          <div id="app-bar-menu" class="app-bar-menu" role="menu" hidden>
            <!-- Every menuitem requires data-menu-tier="public" or "secret". -->
            <button id="choose-puzzle-btn" type="button" class="app-bar-menu__item" role="menuitem" data-menu-tier="public">Choose puzzle</button>
            <button id="edit-puzzle-btn" type="button" class="app-bar-menu__item" role="menuitem" data-menu-tier="secret" data-hide-in-compose hidden>Edit</button>
            <button id="add-puzzle-btn" type="button" class="app-bar-menu__item" role="menuitem" data-menu-tier="secret" data-hide-in-compose hidden>Add new</button>
            <button id="delete-puzzle-btn" type="button" class="app-bar-menu__item" role="menuitem" data-menu-tier="secret" data-hide-in-compose hidden>Delete</button>
            <button id="view-drafts-btn" type="button" class="app-bar-menu__item" role="menuitem" data-menu-tier="secret" data-hide-in-compose hidden>Open draft</button>
            <button id="open-debug-puzzle-btn" type="button" class="app-bar-menu__item" role="menuitem" data-menu-tier="secret" hidden>Debug puzzle</button>
          </div>
        </div>
      </header>
      <div class="puzzle-stack">
        <div class="vignette-wrap">
          <div id="vignette" class="vignette"></div>
        </div>
        <section class="board" aria-label="Word grid" id="board"></section>
      </div>

      <div class="debug-ui">
        <div id="paletteChips" class="paletteChips"></div>
        <section class="controls">
          <div class="row">
            <button id="newGameBtn" class="btn" type="button">New game</button>
          </div>

          <div class="row">
            <div id="status" class="status" aria-live="polite"></div>
          </div>

          <div class="row hints">
            <span class="label">Hints:</span>
            <button id="hintCategoryBtn" class="btn btn-secondary" type="button">Reveal a category</button>
            <button id="hintWordBtn" class="btn btn-secondary" type="button">Reveal a word</button>
            <button id="glossaryBtn" class="btn btn-secondary" type="button">Glossary</button>
          </div>

          <div id="most-recent-guess"></div>
        </section>
      </div>

      <section class="found debug-ui">
        <h2>Found Relationships</h2>
        <div id="foundGroups" class="foundGroups"></div>
      </section>

      <section class="guesses debug-ui" id="guesses"></section>

      <section class="footer-controls debug-ui">
        <div class="row">
          <label class="label" for="puzzleSelect">Puzzle:</label>
          <select id="puzzleSelect" class="select"></select>
        </div>
        <div id="uploader-container"></div>
      </section>
    </main>

    <footer id="fixed-footer" class="bottom-sheet" aria-label="Game controls">
      <div id="cta-stack-play" class="cta-stack">
        <button id="submitBtn" class="btn btn-primary btn-block" type="button">Submit</button>
        <div class="cta-row">
          <button id="shuffleBtn" class="btn btn-block-half" type="button">Shuffle</button>
          <button id="clearBtn" class="btn btn-secondary btn-block-half" type="button">Clear</button>
        </div>
      </div>
      <div id="cta-stack-edit" class="cta-stack" hidden>
        <button id="publishBtn" class="btn btn-primary btn-block" type="button">Publish</button>
        <div class="cta-row">
          <button id="saveBtn" class="btn btn-block-half" type="button">Save draft</button>
          <button id="cancelEditBtn" class="btn btn-secondary btn-block-half" type="button">Close/Cancel</button>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="./src/main.js"></script>

  <div id="glossary-tooltip" class="tooltip" style="display: none;"></div>
</body>
</html>
