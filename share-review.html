<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Share bracket review</title>
  <link rel="stylesheet" href="styles/fonts.css" />
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: Inter, system-ui, sans-serif;
    }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: flex-start;
    }
    figure {
      margin: 0;
    }
    figcaption {
      margin-top: 8px;
      font-size: 13px;
      color: #aaa;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      background: #1f1f1f;
    }
    .status { margin-top: 16px; font-size: 13px; color: #8f8; }
    .error { color: #f88; }
  </style>
</head>
<body>
  <h1>Share artifacts — one per emoji bracket</h1>
  <div class="row" id="row"></div>
  <p class="status" id="status">Rendering…</p>
  <script type="module">
    import { renderGuessShareCanvas } from "./src/shareResults.js";

    const TITLE = "I’m an open book and you’re a rollercoaster";
    const GROUPS = [
      { colors: { bg: "#F5D368", text: "#493D2F" } },
      { colors: { bg: "#C9BBA3", text: "#493D2F" } },
      { colors: { bg: "#E9C478", text: "#493D2F" } },
      { colors: { bg: "#574937", text: "#C9BBA3" } },
    ];
    const COLORS = GROUPS.map((g) => g.colors);

    /** Representative n + fixed emoji per bracket for review. */
    const BRACKETS = [
      { key: "4", n: 4, emoji: "🚀", label: "4 · 🤩🔥🚀🏆" },
      { key: "5-7", n: 6, emoji: "🎉", label: "5–7 · 🎉💪🙌🥳" },
      { key: "8-12", n: 10, emoji: "😎", label: "8–12 · 🍭😻✨😎" },
      { key: "13+", n: 13, emoji: "❤️‍🔥", label: "13+ · ❤️‍🔥🌈😅🤍" },
    ];

    function fakeGuesses(n) {
      return Array.from({ length: n }, (_, row) => ({
        words: Array.from({ length: 4 }, () => ({
          colors: COLORS[row % COLORS.length],
        })),
      }));
    }

    const row = document.getElementById("row");
    const status = document.getElementById("status");
    /** @type {Record<string, string>} */
    window.__shareReviewPngs = {};

    try {
      for (const bracket of BRACKETS) {
        const canvas = await renderGuessShareCanvas({
          guesses: fakeGuesses(bracket.n),
          title: TITLE,
          groups: GROUPS,
          emoji: bracket.emoji,
        });
        const figure = document.createElement("figure");
        const caption = document.createElement("figcaption");
        caption.textContent = `${bracket.label} (n=${bracket.n}, emoji=${bracket.emoji})`;
        figure.appendChild(canvas);
        figure.appendChild(caption);
        row.appendChild(figure);

        const dataUrl = canvas.toDataURL("image/png");
        window.__shareReviewPngs[bracket.key] = dataUrl;
      }
      status.textContent = "Ready.";
      status.dataset.ready = "1";
    } catch (err) {
      status.className = "status error";
      status.textContent = String(err?.message || err);
      status.dataset.ready = "0";
      console.error(err);
    }
  </script>
</body>
</html>
