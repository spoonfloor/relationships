<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Share artifact mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* ——— main knobs ——— */
      --content-width: 420px;
      --outer-margin: 40px;
      --page-color: #1f1f1f;

      --title-weight: 600;
      --count-weight: 400;
      --stack-gap: 36px;
      --logo-gap-below: 38px; /* logo → title only */
      --count-gap-above: 26px; /* title → guess count only */
      --grid-gap-above: 46px; /* guess count → grid only */

      --tile-radius: 16px;
      --tile-gap: 18px;

      --title-size: 40px;
      --count-size: 36px;
      --fg: #f0f0f0;

      --guess-rows: 4;

      /*
        4 columns, fixed outer width = --content-width.
        Bigger --tile-gap → smaller --tile; outer grid width stays constant.
        Height grows with --guess-rows.
      */
      --tile: calc((var(--content-width) - 3 * var(--tile-gap)) / 4);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px 48px;
      background: #0a0a0a;
      color: var(--fg);
      font-family: Inter, system-ui, sans-serif;
      overflow-x: auto;
    }

    .layout {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: flex-start;
      gap: 24px;
      width: max-content;
      margin: 0 auto;
    }

    .share {
      width: calc(var(--content-width) + 2 * var(--outer-margin));
      flex-shrink: 0;
      padding: var(--outer-margin);
      background: var(--page-color);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
    }

    .share > * + * {
      margin-top: var(--stack-gap);
    }

    .share > .share__title {
      margin-top: var(--logo-gap-below); /* overrides stack gap: logo → title only */
    }

    .share__logo-slot {
      width: var(--content-width);
      flex-shrink: 0;
      line-height: 0;
    }

    .share__logo-slot svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .share__title {
      margin: 0;
      width: var(--content-width);
      font-weight: var(--title-weight);
      font-size: var(--title-size);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .share__count {
      margin: 0;
      width: var(--content-width);
      font-weight: var(--count-weight);
      font-size: var(--count-size);
      line-height: 1.3;
    }

    .share > .share__count {
      margin-top: var(--count-gap-above); /* overrides stack gap: title → count only */
    }

    .share > .share__grid {
      margin-top: var(--grid-gap-above); /* overrides stack gap: count → grid only */
    }

    .share__grid {
      width: var(--content-width);
      height: calc(
        var(--guess-rows) * var(--tile) + (var(--guess-rows) - 1) * var(--tile-gap)
      );
      display: grid;
      grid-template-columns: repeat(4, var(--tile));
      grid-template-rows: repeat(var(--guess-rows), var(--tile));
      gap: var(--tile-gap);
    }

    .share__tile {
      width: var(--tile);
      height: var(--tile);
      border-radius: var(--tile-radius);
      background: var(--c, #444);
    }

    .controls {
      width: 280px;
      flex-shrink: 0;
      position: sticky;
      top: 32px;
      display: grid;
      gap: 10px;
      padding: 16px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #161616;
      font-size: 13px;
    }

    .controls label {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 12px;
      align-items: center;
    }

    .controls label span:first-child {
      grid-column: 1 / -1;
      color: #aaa;
    }

    .controls input[type="range"] { width: 100%; }

    .controls input[type="color"] {
      width: 40px;
      height: 28px;
      padding: 0;
      border: 1px solid #444;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }

    .controls output {
      font-variant-numeric: tabular-nums;
      color: #fff;
    }

    .controls__actions {
      display: grid;
      gap: 8px;
      margin-top: 4px;
    }

    .controls button {
      appearance: none;
      border: 1px solid #444;
      border-radius: 8px;
      background: #222;
      color: #fff;
      font: inherit;
      padding: 8px 12px;
      cursor: pointer;
    }

    .controls button:hover {
      background: #2a2a2a;
    }

  </style>
</head>

    </label>

      <span>Tile gap (--tile-gap) — tiles shrink; grid outer size stays fixed</span>

      <output name="tile-gap-out">18px</output>
    </label>

  <script>
    /** Sample group bgs (index 0–3). Color 4 fills both #swatch-4a and #swatch-4b. */
    const GROUP_BGS = ["#F5D368", "#C9BBA3", "#E9C478", "#574937"];

    const EMOJI_POOLS = [
      { max: 4, emojis: ["🤩", "🔥", "🚀", "🏆"] },
      { max: 7, emojis: ["🎉", "💪", "🙌", "🥳"] },
      { max: 12, emojis: ["🍭", "😻", "✨", "😎"] },
      { max: Infinity, emojis: ["❤️‍🔥", "🌈", "😅", "🤍"] },
    ];

    /** @type {string} */
    let currentEmoji = "🎉";
    /** @type {number} */
    let lastGuesses = -1;

    function emojiPoolForGuesses(n) {
      for (const pool of EMOJI_POOLS) {
        if (n <= pool.max) return pool.emojis;
      }
      return EMOJI_POOLS[EMOJI_POOLS.length - 1].emojis;
    }

    function pickEmoji(n) {
      const pool = emojiPoolForGuesses(n);
      return pool[Math.floor(Math.random() * pool.length)];
    }

    /**
     * Match header logo coloring: fill every node for group n.
     * Accepts #swatch-4, #swatch-4a / #swatch-4b, #swatch-4-T / #swatch-4-B.
     */
    function swatchElementsForIndex(root, index) {
      const n = index + 1;
      const prefix = `swatch-${n}`;
      return [...root.querySelectorAll(`[id^="${prefix}"]`)].filter((el) => {
        const id = el.id;
        if (id === prefix) return true;
        const rest = id.slice(prefix.length);
        return rest.charAt(0) === "a" || rest.charAt(0) === "b" || rest.charAt(0) === "-";
      });
    }

    function applyShareLogoSwatches(svg, bgs) {
      for (let i = 0; i < 4; i += 1) {
        const fill = bgs[i];
        for (const el of swatchElementsForIndex(svg, i)) {
          el.removeAttribute("class");
          el.style.fill = fill;
        }
      }
      const text = svg.querySelector("#text");
      if (text instanceof SVGElement) {
        text.removeAttribute("class");
        text.style.fill = getComputedStyle(document.documentElement)
          .getPropertyValue("--fg")
          .trim() || "#fff";
        for (const path of text.querySelectorAll("path")) {
          path.removeAttribute("class");
          path.style.fill = "inherit";
        }
      }
    }

    function initLogo() {
      const svg = document.querySelector("#logoSlot svg");
      if (!(svg instanceof SVGSVGElement)) return;
      svg.removeAttribute("width");
      svg.removeAttribute("height");
      svg.setAttribute("aria-hidden", "true");
      applyShareLogoSwatches(svg, GROUP_BGS);
    }

    const grid = document.getElementById("grid");
    const countLine = document.getElementById("countLine");
    const root = document.documentElement;
    const form = document.getElementById("controls");

    function renderGrid(rows) {
      grid.replaceChildren();
      root.style.setProperty("--guess-rows", String(rows));
      for (let row = 0; row < rows; row += 1) {
        const c = GROUP_BGS[row % GROUP_BGS.length];
        for (let col = 0; col < 4; col += 1) {
          const d = document.createElement("div");
          d.className = "share__tile";
          d.style.setProperty("--c", c);
          grid.appendChild(d);
        }
      }
    }

    function renderCountLine(n, emoji) {
      const label = n === 1 ? "guess" : "guesses";
      countLine.textContent = `Solved in ${n} ${label} ${emoji}`;
    }

    function syncGuesses({ rerollEmoji }) {
      const n = Number(form["guesses"].value);
      form["guesses-out"].value = String(n);
      if (rerollEmoji || n !== lastGuesses) {
        currentEmoji = pickEmoji(n);
        lastGuesses = n;
      }
      renderCountLine(n, currentEmoji);
      renderGrid(n);
    }

    function syncStyles() {
      const pc = form["page-color"].value;
      const om = form["outer-margin"].value;
      const tw = form["title-weight"].value;
      const cw = form["count-weight"].value;
      const ts = form["title-size"].value;
      const cs = form["count-size"].value;
      const sg = form["stack-gap"].value;
      const lgb = form["logo-gap-below"].value;
      const cga = form["count-gap-above"].value;
      const gga = form["grid-gap-above"].value;
      const tr = form["tile-radius"].value;
      const tg = form["tile-gap"].value;
      root.style.setProperty("--page-color", pc);
      root.style.setProperty("--outer-margin", `${om}px`);
      root.style.setProperty("--title-weight", tw);
      root.style.setProperty("--count-weight", cw);
      root.style.setProperty("--title-size", `${ts}px`);
      root.style.setProperty("--count-size", `${cs}px`);
      root.style.setProperty("--stack-gap", `${sg}px`);
      root.style.setProperty("--logo-gap-below", `${lgb}px`);
      root.style.setProperty("--count-gap-above", `${cga}px`);
      root.style.setProperty("--grid-gap-above", `${gga}px`);
      root.style.setProperty("--tile-radius", `${tr}px`);
      root.style.setProperty("--tile-gap", `${tg}px`);
      form["page-color-out"].value = pc;
      form["outer-margin-out"].value = `${om}px`;
      form["title-weight-out"].value = tw;
      form["count-weight-out"].value = cw;
      form["title-size-out"].value = `${ts}px`;
      form["count-size-out"].value = `${cs}px`;
      form["stack-gap-out"].value = `${sg}px`;
      form["logo-gap-below-out"].value = `${lgb}px`;
      form["count-gap-above-out"].value = `${cga}px`;
      form["grid-gap-above-out"].value = `${gga}px`;
      form["tile-radius-out"].value = `${tr}px`;
      form["tile-gap-out"].value = `${tg}px`;
    }

    form.addEventListener("input", (event) => {
      if (event.target instanceof HTMLElement && event.target.name === "guesses") {
        syncGuesses({ rerollEmoji: true });
        return;
      }
      syncStyles();
    });

    form["randomize-emoji"].addEventListener("click", () => {
      syncGuesses({ rerollEmoji: true });
    });

    syncStyles();
    syncGuesses({ rerollEmoji: true });
    initLogo();
  </script>
</body>
</html>
